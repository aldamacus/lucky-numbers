[project]
name = "lucky-numbers"
version = "0.1.0"
description = "Deterministic Vedic-numerology + planetary-alignment lottery number generator"
requires-python = ">=3.10"
authors = [{ name = "Alexandru Damacus" }]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "simpleeval>=0.9.13",
    "rich>=13.7",
]

[project.scripts]
lucky = "lucky_numbers.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

