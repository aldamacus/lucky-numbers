modifiers:
- id: mahadasa_lord_emphasis
  when: 'true'
  action: weight_planet
  planet: dasa.self.mahadasa
  weight: 5
  reason: Active Mahadasa lord gets harmonics boosted
- id: bhukti_lord_emphasis
  when: 'true'
  action: weight_planet
  planet: dasa.self.bhukti
  weight: 4
  reason: Active Bhukti (sub-period) lord boosted
- id: antara_lord_emphasis
  when: 'true'
  action: weight_planet
  planet: dasa.self.antara
  weight: 2
  reason: Active Antara lord boosted
- id: other_mahadasa_emphasis
  when: 'true'
  action: weight_planet
  planet: dasa.other.mahadasa
  weight: 2
  reason: Person 2 (other) Mahadasa lord — secondary contribution (~½ of Person 1)
- id: other_bhukti_emphasis
  when: 'true'
  action: weight_planet
  planet: dasa.other.bhukti
  weight: 1
  reason: Person 2 (other) Bhukti (sub-period) lord — minor contribution
- id: saturn_dasa_caution
  when: dasa.self.mahadasa == 'Saturn' and dasa.self.bhukti == 'Saturn'
  action: remove_range
  low: 13
  high: 13
  reason: Saturn-Saturn — drop classical 'unlucky' 13
