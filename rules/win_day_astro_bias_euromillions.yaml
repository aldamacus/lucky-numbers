modifiers:
- id: win_day_numbers_baseline_euromillions
  when: system == 'euromillions'
  action: add_many
  values: &id001
  - 7
  - 3
  - 8
  - 4
  - 12
  - 5
  - 11
  - 9
  - 6
  - 17
  - 2
  - 10
  - 1
  - 42
  - 44
  - 33
  - 25
  - 27
  weight: 5
  reason: Win-day numbers baseline boost (system-specific).
- id: win_day_sign_match_euromillions_sun_virgo
  when: system == 'euromillions' and transits.self.sun.sign == 'Virgo'
  action: add_many
  values: *id001
  weight: 9
  reason: 'Win-day astrology bias (Person 1): many jackpot-win days had Sun in Virgo
    at draw time; boost win-day numbers when today''s transits match.'
- id: win_day_sign_match_euromillions_other_sun_virgo
  when: system == 'euromillions' and transits.other.sun.sign == 'Virgo'
  action: add_many
  values: *id001
  weight: 4
  reason: 'Win-day astrology bias (Person 2): Sun in Virgo in Person 2''s current
    sky matches a historical jackpot-win signature — secondary boost.'
