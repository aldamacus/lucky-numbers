modifiers:
- id: win_day_numbers_baseline_euromillions
  when: system == 'euromillions'
  action: add_many
  values: &id001
  - 7
  - 8
  - 3
  - 4
  - 12
  - 5
  - 11
  - 9
  - 6
  - 17
  - 10
  - 2
  - 1
  - 42
  - 33
  - 44
  - 25
  - 27
  weight: 5
  reason: Win-day numbers baseline boost (system-specific).
- id: win_day_sign_match_euromillions_sun_virgo
  when: system == 'euromillions' and transits.self.sun.sign == 'Virgo'
  action: add_many
  values: *id001
  weight: 9
  reason: 'Win-day astrology bias: many jackpot-win days had Sun in Virgo at draw
    time; boost win-day numbers when today''s transits match.'
