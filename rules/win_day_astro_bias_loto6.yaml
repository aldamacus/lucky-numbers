modifiers:
- id: win_day_numbers_baseline_loto6
  when: system == 'loto6'
  action: add_many
  values: &id001
  - 7
  - 3
  - 5
  - 26
  - 24
  - 39
  - 11
  - 16
  - 28
  - 4
  - 27
  - 25
  - 40
  - 35
  - 12
  - 29
  - 30
  - 34
  weight: 5
  reason: Win-day numbers baseline boost (system-specific).
- id: win_day_sign_match_loto6_sun_sagittarius
  when: system == 'loto6' and transits.self.sun.sign == 'Sagittarius'
  action: add_many
  values: *id001
  weight: 9
  reason: 'Win-day astrology bias: many jackpot-win days had Sun in Sagittarius at
    draw time; boost win-day numbers when today''s transits match.'
